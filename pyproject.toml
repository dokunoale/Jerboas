[project]
name = "jerboas"
version = "0.1.0"
description = "A non-deterministic-first, ORM-like graph query library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alessio Sechi", email = "alessio.2400@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Fitting an embedding needs torch; serving one does not. Training writes a
# checkpoint of plain arrays that strategies.Embedding reads with numpy alone,
# so a deployment installs the base package and only a trainer needs this.
torch = [
    "torch>=2.5",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
]
all = [
    "jerboas[torch,api,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jerboas*"]
